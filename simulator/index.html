<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
:root{--bg:#0b1020;--p:#141b2f;--p2:#1b2440;--line:#263150;--t:#e8ecf8;--m:#8a96b5;--a:#5b8cff;--a2:#8b5cf6;--ok:#34d399;--bad:#f87171}
[data-theme=light]{--bg:#f3f5fb;--p:#fff;--p2:#eef1f9;--line:#d9deee;--t:#1a2036;--m:#66708f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;color:var(--t);background:var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
h1{margin:0;font-size:1.5rem}
h1 span{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.right{display:flex;gap:8px;align-items:center}
.badge{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--m);background:var(--p);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem}.stat small{color:var(--m);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.bar{height:6px;background:var(--p2);border-radius:9px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .4s}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:34px}
.chip{border:1px solid var(--line);background:var(--p2);color:var(--t);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip.active,.chip:hover{border-color:var(--a)}
.empty{color:var(--m);font-size:.9rem}
.scene{perspective:1000px}
.card{position:relative;height:220px;transform-style:preserve-3d;transition:transform .55s}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff}
.front{background:linear-gradient(145deg,#3a5bd9,#6a3fd1)}
.back{background:linear-gradient(145deg,#0f7a5a,#16688f);transform:rotateY(180deg)}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:.8;margin-bottom:8px}
.txt{font-size:1.25rem;line-height:1.4;overflow-y:auto;max-height:140px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;color:#fff;background:linear-gradient(90deg,var(--a),var(--a2))}
button.ghost{background:var(--p2);border:1px solid var(--line);color:var(--t)}
button.good{background:var(--ok);color:#052} button.bad{background:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--p2);color:var(--m);border:1px solid var(--line)}
.tabs button.on{color:var(--t);border-color:var(--a)}
input,textarea{width:100%;font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
input:focus,textarea:focus{outline:none;border-color:var(--a)}textarea{resize:vertical;min-height:56px}
#calls{max-height:280px;overflow-y:auto;font:12px ui-monospace,Consolas,monospace}
.call{border-left:3px solid var(--a);background:var(--p2);padding:6px 8px;margin-bottom:6px;border-radius:0 8px 8px 0;word-break:break-word}
.call b{color:var(--a)}
.ask{margin-top:14px}
#log{max-height:110px;overflow-y:auto;font-size:.9rem;margin-bottom:8px}
.you{color:var(--a);text-align:right;margin:3px 0}.bot{color:var(--ok);margin:3px 0}
.row{display:flex;gap:8px}.row input{margin:0}
#mic.live{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
.hint{color:var(--m);font-size:.75rem;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:var(--p2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Study <span>Buddy</span></h1>
  <div class="right">
    <label class="badge"><input type="checkbox" id="voice" style="width:auto;margin:0"> Read aloud</label>
    <div class="badge"><span class="dot" id="dot"></span><span id="status">connecting...</span></div>
    <button class="ghost" id="theme">Theme</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><b id="sSeen">0</b><small>Reviewed</small></div>
  <div class="stat"><b id="sAcc">-</b><small>Accuracy</small></div>
  <div class="stat"><b id="sStreak">0</b><small>Streak</small></div>
  <div class="stat"><b id="sTopics">0</b><small>Topics</small></div>
</div>
<div class="bar"><i id="barfill"></i></div>

<div class="grid">
  <section class="panel">
    <h2>Quiz</h2>
    <div class="chips" id="chips"></div>
    <div class="scene"><div class="card" id="card">
      <div class="face front"><div class="lbl" id="tl">Question</div><div class="txt" id="q">Pick a topic to start.</div></div>
      <div class="face back"><div class="lbl">Answer</div><div class="txt" id="a"></div></div>
    </div></div>
    <div class="actions">
      <button id="reveal" disabled>Show answer</button>
      <button class="good" id="ok" disabled>Got it (1)</button>
      <button class="bad" id="miss" disabled>Missed (2)</button>
      <button class="ghost" id="next" disabled>Skip</button>
    </div>
    <div class="hint">Shortcuts: Space flips the card, 1 = got it, 2 = missed</div>
  </section>

  <section class="panel">
    <div class="tabs"><button class="on" id="t1">Add card</button><button id="t2">MCP activity</button></div>
    <div id="add">
      <input id="fT" placeholder="Topic (e.g. operating systems)">
      <textarea id="fQ" placeholder="Question"></textarea>
      <textarea id="fA" placeholder="Answer"></textarea>
      <button id="save">Save card</button>
    </div>
    <div id="calls" style="display:none"></div>
  </section>
</div>

<section class="panel ask">
  <h2>Ask Alexa+ (simulated)</h2>
  <div id="log"></div>
  <div class="row">
    <input id="msg" placeholder="quiz me on operating systems">
    <button id="mic" title="Speak">Mic</button>
    <button id="send">Send</button>
  </div>
  <div class="hint">Say or type: "quiz me on os", "show answer", "next", "topics"</div>
</section>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let topic = "", has = false, flipped = false, st = {seen:0, ok:0, streak:0};

function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("show"),2400)}
function say(cls,text){const d=document.createElement("div");d.className=cls;d.textContent=text;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight}
function speak(s){if($("voice").checked&&window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(s))}}
async function chat(message){
  const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  const reply=(await r.json()).reply;refreshActivity();return reply;
}
async function refreshActivity(){
  try{
    const records=await (await fetch("/activity")).json();const box=$("calls");box.replaceChildren();
    records.forEach(item=>{
      const d=document.createElement("div");d.className="call";
      const h=document.createElement("b");h.textContent=`${new Date(item.time).toLocaleTimeString()}  ${item.tool}(${JSON.stringify(item.arguments)}) — ${item.status}`;
      const r=document.createElement("div");r.textContent="-> "+item.summary;d.append(h,r);box.appendChild(d);
    });
  }catch(e){}
}
const isErr=s=>/^(No cards|Could not reach|Use:|Try:|Ask for)/.test(s);

function renderStats(){
  $("sSeen").textContent=st.seen;
  $("sAcc").textContent=st.seen?Math.round(st.ok/st.seen*100)+"%":"-";
  $("sStreak").textContent=st.streak;
  $("barfill").style.width=(st.seen?st.ok/st.seen*100:0)+"%";
}
function setButtons(){
  $("reveal").disabled=!has||flipped;$("ok").disabled=!flipped;$("miss").disabled=!flipped;$("next").disabled=!has;
}

async function loadTopics(){
  const reply=await chat("topics");
  const up=!reply.startsWith("Could not reach");
  $("dot").classList.toggle("on",up);
  $("status").textContent=up?"MCP server connected":"MCP server offline";
  const box=$("chips");box.innerHTML="";
  const list=(!up||reply.startsWith("No topics"))?[]:reply.split(", ");
  $("sTopics").textContent=list.length;
  if(!list.length){const e=document.createElement("span");e.className="empty";
    e.textContent=up?"No topics yet. Add your first card.":"Start server.py on port 8000.";box.appendChild(e);return}
  list.forEach(t=>{const b=document.createElement("button");b.className="chip"+(t===topic?" active":"");
    b.textContent=t;b.onclick=()=>quiz(t);box.appendChild(b)});
}

async function quiz(t){
  if(!t)return;
  const reply=await chat("quiz me on "+t);
  if(isErr(reply)){toast(reply);return}
  topic=t;has=true;flipped=false;
  $("card").classList.remove("flipped");
  $("q").textContent=reply;$("a").textContent="";$("tl").textContent=t;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.textContent===t));
  setButtons();speak(reply);
}
async function reveal(){
  if(!has||flipped)return;
  const reply=await chat("answer");
  $("a").textContent=reply;flipped=true;$("card").classList.add("flipped");setButtons();speak(reply);
}
function grade(good){
  if(!flipped)return;
  st.seen++;if(good){st.ok++;st.streak++}else st.streak=0;
  renderStats();quiz(topic);
}

$("reveal").onclick=reveal;$("ok").onclick=()=>grade(true);$("miss").onclick=()=>grade(false);$("next").onclick=()=>quiz(topic);

$("save").onclick=async()=>{
  const t=$("fT").value.trim(),q=$("fQ").value.trim(),a=$("fA").value.trim();
  if(!t||!q||!a){toast("Fill in topic, question and answer.");return}
  if([t,q,a].some(x=>x.includes("|"))){toast("Please avoid the | character.");return}
  toast(await chat(`add ${t} | ${q} | ${a}`));
  $("fQ").value="";$("fA").value="";loadTopics();
};

async function handle(text){
  const t=text.trim().replace(/[.?!]+$/,"");if(!t)return;
  say("you",t);const l=t.toLowerCase();
  if(l.startsWith("quiz me on ")){await quiz(t.slice(11).trim());say("bot",$("q").textContent)}
  else if(l.includes("answer")){await reveal();say("bot",$("a").textContent||"Ask for a quiz first.")}
  else if(l==="next"||l.includes("next card")){await quiz(topic);say("bot",$("q").textContent)}
  else if(l.includes("topics")){await loadTopics();say("bot","Topics: "+$("sTopics").textContent)}
  else say("bot","Try: quiz me on <topic>, show answer, next, topics");
}
function send(){const v=$("msg").value;$("msg").value="";handle(v)}
$("send").onclick=send;$("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();rec.lang="en-US";
  rec.onresult=e=>handle(e.results[0][0].transcript);
  rec.onend=()=>$("mic").classList.remove("live");
  $("mic").onclick=()=>{try{rec.start();$("mic").classList.add("live")}catch(e){}};
}else $("mic").style.display="none";

$("t1").onclick=()=>{$("add").style.display="";$("calls").style.display="none";$("t1").classList.add("on");$("t2").classList.remove("on")};
$("t2").onclick=()=>{$("add").style.display="none";$("calls").style.display="";$("t2").classList.add("on");$("t1").classList.remove("on")};
$("theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark"};

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();flipped?quiz(topic):reveal()}
  else if(e.key==="1")grade(true);else if(e.key==="2")grade(false);
});

renderStats();setButtons();loadTopics();
</script>
</body>
</html>
